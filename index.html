<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIOSEPT AGENCY OS | CRM & ERP</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body class="bg-[#0A0D14] text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const DEFAULT_AGENCY = {
      name: 'TRIOSEPT DESIGN STUDIO',
      tagline: 'Branding & Graphic Design Agency',
      contactPerson: 'Vikas Modi',
      phone: '+91 96872 72246',
      email: 'triosept9@gmail.com',
      address: 'FF-02, Seventh Parisar, Opp. Vishnudhara Gardens, Western Circle, Gota, Ahmedabad - 382481',
      gstin: '24AAACV1234F1Z8',
      bankName: 'Punjab National Bank',
      bankBranch: 'Vaishno Devi Circle',
      accountName: 'TRIOSEPT DESIGN STUDIO',
      accountNumber: '9555002100000490',
      ifsc: 'PUNB0955500',
      upiId: '9687272246@pnb'
    };

    const INITIAL_CLIENTS = [
      { id: 'CL-101', name: 'Vedic Pure Foods Pvt Ltd', contactPerson: 'Karan Shah', phone: '+91 98250 12345', email: 'karan@vedicpure.in', industry: 'FMCG Food & Snacks', city: 'Ahmedabad', gstin: '24AAACV1234F1Z8', totalBilled: 245000, outstanding: 15000 },
      { id: 'CL-102', name: 'Zentis Pharma Lifecare', contactPerson: 'Dr. Neha Parikh', phone: '+91 98795 67890', email: 'drneha@zentispharma.com', industry: 'Healthcare & Pharma', city: 'Vadodara', gstin: '24AABZ9876Q1Z2', totalBilled: 420000, outstanding: 0 },
      { id: 'CL-103', name: 'UrbanCraft Apparel', contactPerson: 'Devang Mehta', phone: '+91 94260 88214', email: 'devang@urbancraft.co.in', industry: 'Fashion & Retail', city: 'Surat', gstin: '24AABCU4321R1Z5', totalBilled: 125000, outstanding: 35000 }
    ];

    const INITIAL_LEADS = [
      { id: 'LD-401', leadName: 'Rajesh Solanki', companyName: 'Nava Naturals Organic', phone: '+91 97123 45678', email: 'rajesh@navanaturals.com', service: 'FMCG Packaging Design', budget: 95000, stage: 'Quotation Sent' },
      { id: 'LD-402', leadName: 'Priya Choksi', companyName: 'Chokshi Gems & Jewels', phone: '+91 98980 11223', email: 'priya@chokshijewels.in', service: 'Complete Branding', budget: 180000, stage: 'Meeting Scheduled' },
      { id: 'LD-403', leadName: 'Amit Rawal', companyName: 'Apex Logistics Hub', phone: '+91 98244 55667', email: 'amit@apexlog.com', service: 'Logo Design & Identity', budget: 45000, stage: 'Negotiation' }
    ];

    const INITIAL_PROJECTS = [
      { id: 'PRJ-801', title: 'Vedic Pure Masala Packaging Series', clientId: 'CL-101', clientName: 'Vedic Pure Foods Pvt Ltd', budget: 85000, deadline: '2026-11-10', designer: 'Tanvi Joshi', priority: 'High', status: 'In Progress', progress: 75 },
      { id: 'PRJ-802', title: 'Zentis Neuro Syrup Box & Label Branding', clientId: 'CL-102', clientName: 'Zentis Pharma Lifecare', budget: 120000, deadline: '2026-11-02', designer: 'Rohan Sharma', priority: 'Urgent', status: 'Revision Required', progress: 90 },
      { id: 'PRJ-803', title: 'UrbanCraft Festive Social Creatives', clientId: 'CL-103', clientName: 'UrbanCraft Apparel', budget: 35000, deadline: '2026-11-15', designer: 'Aarav Patel', priority: 'Medium', status: 'In Progress', progress: 40 }
    ];

    const INITIAL_TASKS = [
      { id: 'TSK-1001', clientId: 'CL-101', title: 'Refine Back-of-Pack Nutritional Table Dieline', assignedTo: 'Tanvi Joshi', dueDate: '2026-11-03', priority: 'High', completed: false },
      { id: 'TSK-1002', clientId: 'CL-101', title: 'Generate High-Res 3D Isometric Pouches', assignedTo: 'Tanvi Joshi', dueDate: '2026-11-04', priority: 'Urgent', completed: false },
      { id: 'TSK-1003', clientId: 'CL-102', title: 'Incorporate FSSAI registration number and batch stamp', assignedTo: 'Rohan Sharma', dueDate: '2026-11-02', priority: 'Urgent', completed: false },
      { id: 'TSK-1004', clientId: 'CL-103', title: 'Diwali Sale Carousel Graphics Copy & Grid', assignedTo: 'Aarav Patel', dueDate: '2026-11-05', priority: 'Medium', completed: true }
    ];

    const INITIAL_EXPENSES = [
      { id: 'EXP-51', title: 'Adobe Creative Cloud Team License', category: 'Software Subscriptions', amount: 14850, date: '2026-10-05', paymentMode: 'HDFC Credit Card' },
      { id: 'EXP-52', title: 'Studio 4K Monitor Calibration & Cables', category: 'Hardware Expenses', amount: 8200, date: '2026-10-12', paymentMode: 'UPI' },
      { id: 'EXP-53', title: 'Packaging Mockup Cardboard Proofs', category: 'Printing Expenses', amount: 3500, date: '2026-10-18', paymentMode: 'UPI' },
      { id: 'EXP-54', title: 'Freelance 3D Cinema4D Blender Artist (Vedic)', category: 'Freelancer Payments', amount: 18000, date: '2026-10-24', paymentMode: 'Bank Transfer' }
    ];

    const INITIAL_INVOICES = [
      { id: 'INV-2026-061', clientId: 'CL-101', clientName: 'Vedic Pure Foods Pvt Ltd', date: '2026-10-15', dueDate: '2026-10-30', amount: 41300, paidAmount: 41300, status: 'Paid', items: [{ desc: 'FMCG Master Packaging Design Sprint (Haldi & Dhaniya Pouches)', qty: 1, rate: 35000, amount: 35000 }] },
      { id: 'INV-2026-062', clientId: 'CL-101', clientName: 'Vedic Pure Foods Pvt Ltd', date: '2026-10-31', dueDate: '2026-11-15', amount: 41300, paidAmount: 0, status: 'Unpaid', items: [{ desc: 'Final High-Res Vector Artwork & Dielines Release', qty: 1, rate: 35000, amount: 35000 }] },
      { id: 'INV-2026-063', clientId: 'CL-102', clientName: 'Zentis Pharma Lifecare', date: '2026-10-17', dueDate: '2026-11-01', amount: 141600, paidAmount: 141600, status: 'Paid', items: [{ desc: 'Pharma Packaging Box & Label Design System', qty: 1, rate: 120000, amount: 120000 }] },
      { id: 'INV-2026-064', clientId: 'CL-103', clientName: 'UrbanCraft Apparel', date: '2026-10-26', dueDate: '2026-11-10', amount: 41300, paidAmount: 20000, status: 'Partially Paid', items: [{ desc: 'Festive Social Media Creative Campaign (Monthly Pack)', qty: 1, rate: 35000, amount: 35000 }] }
    ];

    function App() {
      const loadLocal = (key, fallback) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        } catch (e) {
          return fallback;
        }
      };

      const [activeTab, setActiveTab] = useState('dashboard');
      const [agency, setAgency] = useState(() => loadLocal('triosept_agency', DEFAULT_AGENCY));
      const [customSvg, setCustomSvg] = useState(() => localStorage.getItem('triosept_svg') || '');
      const [clients, setClients] = useState(() => loadLocal('triosept_clients', INITIAL_CLIENTS));
      const [leads, setLeads] = useState(() => loadLocal('triosept_leads', INITIAL_LEADS));
      const [projects, setProjects] = useState(() => loadLocal('triosept_projects', INITIAL_PROJECTS));
      const [tasks, setTasks] = useState(() => loadLocal('triosept_tasks', INITIAL_TASKS));
      const [expenses, setExpenses] = useState(() => loadLocal('triosept_expenses', INITIAL_EXPENSES));
      const [invoices, setInvoices] = useState(() => loadLocal('triosept_invoices', INITIAL_INVOICES));
      
      const [selectedClientForView, setSelectedClientForView] = useState(null);
      const [printInvoiceData, setPrintInvoiceData] = useState(null);
      const [syncTime, setSyncTime] = useState(new Date().toLocaleTimeString());

      // MODAL CONTROLS
      const [activeModal, setActiveModal] = useState(null);
      const [clientForm, setClientForm] = useState({ name: '', contactPerson: '', phone: '', email: '', industry: '', city: 'Ahmedabad', gstin: '' });
      const [leadForm, setLeadForm] = useState({ leadName: '', companyName: '', phone: '', email: '', service: 'FMCG Packaging Design', budget: 50000 });
      const [projectForm, setProjectForm] = useState({ title: '', clientId: '', budget: 50000, deadline: '', designer: 'Vikas Modi', priority: 'High' });
      const [taskForm, setTaskForm] = useState({ title: '', assignedTo: 'Design Team', dueDate: '', priority: 'Medium' });
      const [expenseForm, setExpenseForm] = useState({ title: '', category: 'Software Subscriptions', amount: '', paymentMode: 'UPI' });
      const [invoiceForm, setInvoiceForm] = useState({ clientName: '', desc: 'Brand Design Services', rate: '' });
      const [progressModalData, setProgressModalData] = useState(null);

      useEffect(() => {
        localStorage.setItem('triosept_agency', JSON.stringify(agency));
        localStorage.setItem('triosept_clients', JSON.stringify(clients));
        localStorage.setItem('triosept_leads', JSON.stringify(leads));
        localStorage.setItem('triosept_projects', JSON.stringify(projects));
        localStorage.setItem('triosept_tasks', JSON.stringify(tasks));
        localStorage.setItem('triosept_expenses', JSON.stringify(expenses));
        localStorage.setItem('triosept_invoices', JSON.stringify(invoices));
        if (customSvg) localStorage.setItem('triosept_svg', customSvg);
        setSyncTime(new Date().toLocaleTimeString());
      }, [agency, clients, leads, projects, tasks, expenses, invoices, customSvg]);

      const totalRevenue = useMemo(() => invoices.reduce((acc, inv) => acc + (inv.paidAmount || 0), 0), [invoices]);
      const totalExpenses = useMemo(() => expenses.reduce((acc, exp) => acc + exp.amount, 0), [expenses]);
      const netProfit = totalRevenue - totalExpenses;
      const totalOutstanding = useMemo(() => invoices.reduce((acc, inv) => acc + (inv.amount - (inv.paidAmount || 0)), 0), [invoices]);

      const handleSvgUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setCustomSvg(event.target.result);
          reader.readAsText(file);
        }
      };

      // MODAL SUBMIT HANDLERS
      const handleCreateClient = (e) => {
        e.preventDefault();
        if (!clientForm.name) return;
        const newClient = {
          id: `CL-${Math.floor(100 + Math.random() * 900)}`,
          name: clientForm.name,
          contactPerson: clientForm.contactPerson || 'Authorized Rep',
          phone: clientForm.phone || '+91 90000 00000',
          email: clientForm.email || 'info@client.com',
          industry: clientForm.industry || 'General',
          city: clientForm.city || 'Ahmedabad',
          gstin: clientForm.gstin || '24AAAAA0000A1Z5',
          totalBilled: 0,
          outstanding: 0
        };
        setClients([...clients, newClient]);
        setActiveModal(null);
        setClientForm({ name: '', contactPerson: '', phone: '', email: '', industry: '', city: 'Ahmedabad', gstin: '' });
      };

      const handleCreateLead = (e) => {
        e.preventDefault();
        if (!leadForm.leadName) return;
        const newLead = {
          id: `LD-${Math.floor(100 + Math.random() * 900)}`,
          leadName: leadForm.leadName,
          companyName: leadForm.companyName || 'New Prospect',
          phone: leadForm.phone || '+91 90000 00000',
          email: leadForm.email || 'lead@mail.com',
          service: leadForm.service,
          budget: parseInt(leadForm.budget) || 50000,
          stage: 'New'
        };
        setLeads([...leads, newLead]);
        setActiveModal(null);
        setLeadForm({ leadName: '', companyName: '', phone: '', email: '', service: 'FMCG Packaging Design', budget: 50000 });
      };

      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!projectForm.title) return;
        const selectedCl = clients.find(c => c.id === projectForm.clientId) || clients[0];
        const newProj = {
          id: `PRJ-${Math.floor(100 + Math.random() * 900)}`,
          title: projectForm.title,
          clientId: selectedCl ? selectedCl.id : 'CL-101',
          clientName: selectedCl ? selectedCl.name : 'Vedic Pure Foods Pvt Ltd',
          budget: parseInt(projectForm.budget) || 50000,
          deadline: projectForm.deadline || new Date().toISOString().split('T')[0],
          designer: projectForm.designer || 'Vikas Modi',
          priority: projectForm.priority || 'High',
          status: 'In Progress',
          progress: 10
        };
        setProjects([...projects, newProj]);
        setActiveModal(null);
        setProjectForm({ title: '', clientId: '', budget: 50000, deadline: '', designer: 'Vikas Modi', priority: 'High' });
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!taskForm.title || !selectedClientForView) return;
        const newTask = {
          id: `TSK-${Math.floor(1000 + Math.random() * 9000)}`,
          clientId: selectedClientForView.id,
          title: taskForm.title,
          assignedTo: taskForm.assignedTo || 'Design Team',
          dueDate: taskForm.dueDate || new Date().toISOString().split('T')[0],
          priority: taskForm.priority || 'Medium',
          completed: false
        };
        setTasks([...tasks, newTask]);
        setActiveModal(null);
        setTaskForm({ title: '', assignedTo: 'Design Team', dueDate: '', priority: 'Medium' });
      };

      const handleCreateExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.title || !expenseForm.amount) return;
        const newExpense = {
          id: `EXP-${Math.floor(100 + Math.random() * 900)}`,
          title: expenseForm.title,
          category: expenseForm.category,
          amount: parseInt(expenseForm.amount) || 0,
          date: new Date().toISOString().split('T')[0],
          paymentMode: expenseForm.paymentMode
        };
        setExpenses([...expenses, newExpense]);
        setActiveModal(null);
        setExpenseForm({ title: '', category: 'Software Subscriptions', amount: '', paymentMode: 'UPI' });
      };

      const handleCreateInvoice = (e) => {
        e.preventDefault();
        if (!invoiceForm.clientName || !invoiceForm.rate) return;
        const subtotal = parseInt(invoiceForm.rate) || 0;
        const total = Math.round(subtotal * 1.18);
        const newInvoice = {
          id: `INV-2026-${Math.floor(100 + Math.random() * 900)}`,
          clientId: 'CL-101',
          clientName: invoiceForm.clientName,
          date: new Date().toISOString().split('T')[0],
          dueDate: new Date(Date.now() + 15 * 86400000).toISOString().split('T')[0],
          amount: total,
          paidAmount: 0,
          status: 'Unpaid',
          items: [{ desc: invoiceForm.desc || 'Brand Design Services', qty: 1, rate: subtotal, amount: subtotal }]
        };
        setInvoices([...invoices, newInvoice]);
        setActiveModal(null);
        setInvoiceForm({ clientName: '', desc: 'Brand Design Services', rate: '' });
      };

      const handleUpdateProgress = (e) => {
        e.preventDefault();
        if (!progressModalData) return;
        setProjects(projects.map(p => p.id === progressModalData.id ? { ...p, progress: parseInt(progressModalData.progress) || 0 } : p));
        setProgressModalData(null);
      };

      return (
        <div className="flex min-h-screen">
          {/* SIDEBAR */}
          <aside className="w-64 bg-[#0F131D] border-r border-slate-800 flex flex-col justify-between shrink-0 p-4">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">
                {customSvg ? (
                  <div className="w-8 h-8 flex items-center justify-center shrink-0" dangerouslySetInnerHTML={{ __html: customSvg }} />
                ) : (
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#FF5500] to-[#FF8800] flex items-center justify-center text-white font-black text-sm">
                    T
                  </div>
                )}
                <div>
                  <h1 className="text-sm font-bold tracking-wider text-white">TRIOSEPT</h1>
                  <p className="text-[10px] text-[#FF6A00] font-semibold tracking-widest uppercase">DESIGN STUDIO</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard' },
                  { id: 'clients', label: 'Client 360 & Tasks' },
                  { id: 'leads', label: 'Leads Pipeline' },
                  { id: 'projects', label: 'Projects' },
                  { id: 'finance', label: 'Accounts & Expenses' },
                  { id: 'reports', label: 'Revenue & Profit' },
                  { id: 'settings', label: 'Studio Settings' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setSelectedClientForView(null); }}
                    className={`w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium transition-all ${
                      activeTab === item.id 
                        ? 'bg-[#FF6A00] text-white shadow-lg shadow-[#FF6A00]/20' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 bg-slate-900/60 rounded-lg border border-slate-800/80 text-[11px] text-slate-400">
              <div className="flex items-center gap-2 mb-1">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-slate-200 font-medium">Real-Time Auto-Save</span>
              </div>
              <p className="text-[10px] text-slate-500">Synced at {syncTime}</p>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 p-8 overflow-y-auto">
            <div className="flex justify-between items-center mb-8">
              <div>
                <h2 className="text-xl font-bold capitalize text-white">
                  {activeTab === 'clients' && selectedClientForView 
                    ? `Client 360: ${selectedClientForView.name}`
                    : activeTab.replace('-', ' ')}
                </h2>
                <p className="text-xs text-slate-400 mt-1">TRIOSEPT Agency OS Management Suite</p>
              </div>

              <div className="flex items-center gap-3">
                <span className="text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300 border border-slate-700">
                  {agency.address.split(',')[0]} (Ahmedabad)
                </span>
              </div>
            </div>

            {/* DASHBOARD MODULE */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl">
                    <p className="text-xs text-slate-400">Total Revenue Collected</p>
                    <h3 className="text-2xl font-bold text-white mt-1">₹{totalRevenue.toLocaleString('en-IN')}</h3>
                    <p className="text-[11px] text-emerald-400 mt-1">From paid invoices</p>
                  </div>
                  <div className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl">
                    <p className="text-xs text-slate-400">Operating Expenses</p>
                    <h3 className="text-2xl font-bold text-rose-400 mt-1">₹{totalExpenses.toLocaleString('en-IN')}</h3>
                    <p className="text-[11px] text-slate-400 mt-1">Software, hardware & freelance</p>
                  </div>
                  <div className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl">
                    <p className="text-xs text-slate-400">Net Studio Profit</p>
                    <h3 className="text-2xl font-bold text-[#FF7A00] mt-1">₹{netProfit.toLocaleString('en-IN')}</h3>
                    <p className="text-[11px] text-slate-400 mt-1">Profit margin: {totalRevenue ? Math.round((netProfit/totalRevenue)*100) : 0}%</p>
                  </div>
                  <div className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl">
                    <p className="text-xs text-slate-400">Outstanding Receivables</p>
                    <h3 className="text-2xl font-bold text-amber-400 mt-1">₹{totalOutstanding.toLocaleString('en-IN')}</h3>
                    <p className="text-[11px] text-slate-400 mt-1">Pending payments</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl">
                    <h3 className="text-sm font-semibold text-white mb-4">Active Projects</h3>
                    <div className="space-y-3">
                      {projects.map((p) => (
                        <div key={p.id} className="p-3 bg-slate-900/60 rounded-lg border border-slate-800/80">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-medium text-slate-200">{p.title}</span>
                            <span className="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-400">{p.status}</span>
                          </div>
                          <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                            <div className="bg-[#FF6A00] h-full rounded-full" style={{ width: `${p.progress}%` }}></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl">
                    <h3 className="text-sm font-semibold text-white mb-4">Urgent Tasks & Deliverables</h3>
                    <div className="space-y-2">
                      {tasks.map((t) => (
                        <div key={t.id} className="flex items-center justify-between p-3 bg-slate-900/40 rounded-lg text-xs border border-slate-800/50">
                          <div className="flex items-center gap-2">
                            <input 
                              type="checkbox" 
                              checked={t.completed} 
                              onChange={() => {
                                setTasks(tasks.map(item => item.id === t.id ? { ...item, completed: !item.completed } : item));
                              }}
                              className="rounded border-slate-700 bg-slate-800 accent-[#FF6A00]" 
                            />
                            <span className={t.completed ? 'line-through text-slate-500' : 'text-slate-300'}>{t.title}</span>
                          </div>
                          <span className="text-[10px] text-slate-400">{t.dueDate}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* CLIENT 360 & TASKS MODULE */}
            {activeTab === 'clients' && (
              <div>
                {!selectedClientForView ? (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <p className="text-xs text-slate-400">Total Clients: {clients.length}</p>
                      <button 
                        onClick={() => setActiveModal('newClient')}
                        className="px-3 py-1.5 bg-[#FF6A00] text-white text-xs font-medium rounded-lg hover:bg-[#FF7A00]"
                      >
                        + Add Client
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {clients.map((c) => (
                        <div key={c.id} className="p-5 bg-[#0F131D] border border-slate-800 rounded-xl space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <h4 className="font-semibold text-white text-sm">{c.name}</h4>
                              <p className="text-xs text-slate-400">{c.contactPerson} ({c.phone})</p>
                            </div>
                            <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded">{c.city}</span>
                          </div>

                          <div className="pt-2 border-t border-slate-800 text-xs flex justify-between">
                            <span className="text-slate-400">Outstanding:</span>
                            <span className="font-semibold text-amber-400">₹{c.outstanding.toLocaleString('en-IN')}</span>
                          </div>

                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Phone</label>
                      <input 
                        type="text" 
                        value={leadForm.phone} 
                        onChange={e => setLeadForm({ ...leadForm, phone: e.target.value })} 
                        placeholder="+91 98980 00000"
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Email</label>
                      <input 
                        type="email" 
                        value={leadForm.email} 
                        onChange={e => setLeadForm({ ...leadForm, email: e.target.value })} 
                        placeholder="lead@brand.com"
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Service Required</label>
                      <select 
                        value={leadForm.service}
                        onChange={e => setLeadForm({ ...leadForm, service: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]"
                      >
                        <option value="Logo Design & Identity">Logo Design & Identity</option>
                        <option value="Complete Branding">Complete Branding</option>
                        <option value="FMCG Packaging Design">FMCG Packaging Design</option>
                        <option value="Social Media Creatives">Social Media Creatives</option>
                        <option value="Brochure & Catalogue">Brochure & Catalogue</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Estimated Budget (₹)</label>
                      <input 
                        type="number" 
                        value={leadForm.budget} 
                        onChange={e => setLeadForm({ ...leadForm, budget: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg hover:bg-[#FF7A00]">Save Lead</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD PROJECT MODAL */}
          {activeModal === 'newProject' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">New Project Workspace</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateProject} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Project Title *</label>
                    <input 
                      type="text" required 
                      value={projectForm.title} 
                      onChange={e => setProjectForm({ ...projectForm, title: e.target.value })} 
                      placeholder="e.g. FMCG Box & Label 3D Visuals"
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Assign Client</label>
                    <select 
                      value={projectForm.clientId}
                      onChange={e => setProjectForm({ ...projectForm, clientId: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]"
                    >
                      {clients.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Project Budget (₹)</label>
                      <input 
                        type="number" 
                        value={projectForm.budget} 
                        onChange={e => setProjectForm({ ...projectForm, budget: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Target Deadline</label>
                      <input 
                        type="date" 
                        value={projectForm.deadline} 
                        onChange={e => setProjectForm({ ...projectForm, deadline: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Lead Designer</label>
                      <input 
                        type="text" 
                        value={projectForm.designer} 
                        onChange={e => setProjectForm({ ...projectForm, designer: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Priority</label>
                      <select 
                        value={projectForm.priority}
                        onChange={e => setProjectForm({ ...projectForm, priority: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg hover:bg-[#FF7A00]">Launch Workspace</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD TASK MODAL (CLIENT 360) */}
          {activeModal === 'newTask' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Add Task for {selectedClientForView ? selectedClientForView.name : ''}</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateTask} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Task Title *</label>
                    <input 
                      type="text" required 
                      value={taskForm.title} 
                      onChange={e => setTaskForm({ ...taskForm, title: e.target.value })} 
                      placeholder="e.g. Export Print Ready CMYK Vector Dielines"
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Assigned Designer</label>
                      <input 
                        type="text" 
                        value={taskForm.assignedTo} 
                        onChange={e => setTaskForm({ ...taskForm, assignedTo: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Due Date</label>
                      <input 
                        type="date" 
                        value={taskForm.dueDate} 
                        onChange={e => setTaskForm({ ...taskForm, dueDate: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg hover:bg-[#FF7A00]">Add Task</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RECORD EXPENSE MODAL */}
          {activeModal === 'newExpense' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Record Studio Expense</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateExpense} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Expense Description *</label>
                    <input 
                      type="text" required 
                      value={expenseForm.title} 
                      onChange={e => setExpenseForm({ ...expenseForm, title: e.target.value })} 
                      placeholder="e.g. Adobe Suite Monthly License"
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Expense Category</label>
                      <select 
                        value={expenseForm.category}
                        onChange={e => setExpenseForm({ ...expenseForm, category: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]"
                      >
                        <option value="Software Subscriptions">Software Subscriptions</option>
                        <option value="Hardware Expenses">Hardware Expenses</option>
                        <option value="Printing Expenses">Printing Expenses</option>
                        <option value="Freelancer Payments">Freelancer Payments</option>
                        <option value="Office & Tea Expenses">Office & Tea Expenses</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Amount (₹) *</label>
                      <input 
                        type="number" required 
                        value={expenseForm.amount} 
                        onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value })} 
                        placeholder="5000"
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Payment Method</label>
                    <select 
                      value={expenseForm.paymentMode}
                      onChange={e => setExpenseForm({ ...expenseForm, paymentMode: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]"
                    >
                      <option value="UPI">UPI</option>
                      <option value="Bank Transfer">Bank Transfer</option>
                      <option value="Credit Card">Credit Card</option>
                      <option value="Cash">Cash</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-rose-500 text-white font-medium rounded-lg hover:bg-rose-600">Save Expense</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CREATE INVOICE MODAL */}
          {activeModal === 'newInvoice' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Create Client Tax Invoice</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateInvoice} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Client Name *</label>
                    <input 
                      type="text" required 
                      value={invoiceForm.clientName} 
                      onChange={e => setInvoiceForm({ ...invoiceForm, clientName: e.target.value })} 
                      placeholder="e.g. Vedic Pure Foods Pvt Ltd"
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Service Line Description</label>
                    <input 
                      type="text" 
                      value={invoiceForm.desc} 
                      onChange={e => setInvoiceForm({ ...invoiceForm, desc: e.target.value })} 
                      placeholder="e.g. Master Packaging Design Sprint"
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Taxable Amount (₹) *</label>
                    <input 
                      type="number" required 
                      value={invoiceForm.rate} 
                      onChange={e => setInvoiceForm({ ...invoiceForm, rate: e.target.value })} 
                      placeholder="35000"
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-[#FF6A00]" 
                    />
                  </div>
                  <div className="p-3 bg-slate-900/60 rounded-lg border border-slate-800 text-[11px] text-slate-400">
                    <p>Subtotal: ₹{invoiceForm.rate ? parseInt(invoiceForm.rate).toLocaleString('en-IN') : 0}</p>
                    <p>+ 18% GST: ₹{invoiceForm.rate ? Math.round(parseInt(invoiceForm.rate) * 0.18).toLocaleString('en-IN') : 0}</p>
                    <p className="font-bold text-white mt-1">Total: ₹{invoiceForm.rate ? Math.round(parseInt(invoiceForm.rate) * 1.18).toLocaleString('en-IN') : 0}</p>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg hover:bg-[#FF7A00]">Generate Invoice</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* UPDATE PROJECT PROGRESS MODAL */}
          {progressModalData && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-xs rounded-2xl p-5 shadow-2xl">
                <h3 className="text-sm font-bold text-white mb-2">Update Progress</h3>
                <p className="text-xs text-slate-400 mb-4">{progressModalData.title}</p>
                <form onSubmit={handleUpdateProgress} className="space-y-4">
                  <div>
                    <div className="flex justify-between text-xs text-slate-300 mb-1">
                      <span>Percentage</span>
                      <span className="font-bold text-[#FF6A00]">{progressModalData.progress}%</span>
                    </div>
                    <input 
                      type="range" min="0" max="100" 
                      value={progressModalData.progress} 
                      onChange={e => setProgressModalData({ ...progressModalData, progress: e.target.value })}
                      className="w-full accent-[#FF6A00]" 
                    />
                  </div>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setProgressModalData(null)} className="px-3 py-1.5 bg-slate-800 text-xs text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-[#FF6A00] text-xs text-white font-medium rounded-lg hover:bg-[#FF7A00]">Update</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* INVOICE PRINT MODAL */}
          {printInvoiceData && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white text-slate-900 w-full max-w-2xl rounded-xl p-8 max-h-[90vh] overflow-y-auto" id="print-area">
                <div className="flex justify-between items-start border-b pb-4 mb-4">
                  <div>
                    <h2 className="text-xl font-bold tracking-tight text-slate-900">{agency.name}</h2>
                    <p className="text-xs text-slate-600 max-w-sm mt-1">{agency.address}</p>
                    <p className="text-xs text-slate-600 mt-1">Phone: {agency.phone} | Email: {agency.email}</p>
                    <p className="text-xs font-semibold text-slate-700">GSTIN: {agency.gstin}</p>
                  </div>
                  <div className="text-right">
                    <h3 className="text-lg font-black text-[#FF6A00]">TAX INVOICE</h3>
                    <p className="text-xs text-slate-700 font-bold">{printInvoiceData.id}</p>
                    <p className="text-xs text-slate-500">Date: {printInvoiceData.date}</p>
                  </div>
                </div>

                <div className="mb-4">
                  <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Billed To:</p>
                  <p className="text-sm font-bold text-slate-800">{printInvoiceData.clientName}</p>
                </div>

                <table className="w-full text-left text-xs mb-6 border">
                  <thead className="bg-slate-100 border-b">
                    <tr>
                      <th className="p-2">Description</th>
                      <th className="p-2 text-center">Qty</th>
                      <th className="p-2 text-right">Rate</th>
                      <th className="p-2 text-right">Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    {printInvoiceData.items.map((item, idx) => (
                      <tr key={idx} className="border-b">
                        <td className="p-2">{item.desc}</td>
                        <td className="p-2 text-center">{item.qty}</td>
                        <td className="p-2 text-right">₹{item.rate.toLocaleString('en-IN')}</td>
                        <td className="p-2 text-right">₹{item.amount.toLocaleString('en-IN')}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div className="flex justify-between items-start text-xs border-t pt-4">
                  <div>
                    <p className="font-bold text-slate-800">Bank Details for RTGS / NEFT / UPI:</p>
                    <p className="text-slate-600">A/C Name: {agency.accountName}</p>
                    <p className="text-slate-600">Bank: {agency.bankName} ({agency.bankBranch})</p>
                    <p className="text-slate-600">A/C No: {agency.accountNumber}</p>
                    <p className="text-slate-600">IFSC: {agency.ifsc}</p>
                    <p className="text-slate-600">UPI ID: {agency.upiId}</p>
                  </div>
                  <div className="text-right space-y-1">
                    <p className="text-slate-600">Subtotal: ₹{printInvoiceData.items.reduce((a,b)=>a+b.amount,0).toLocaleString('en-IN')}</p>
                    <p className="text-slate-600">GST (18%): ₹{(printInvoiceData.amount - printInvoiceData.items.reduce((a,b)=>a+b.amount,0)).toLocaleString('en-IN')}</p>
                    <p className="text-sm font-bold text-slate-900 border-t pt-1">Grand Total: ₹{printInvoiceData.amount.toLocaleString('en-IN')}</p>
                  </div>
                </div>

                <div className="flex justify-end gap-3 mt-6 print:hidden">
                  <button 
                    onClick={() => setPrintInvoiceData(null)}
                    className="px-4 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded"
                  >
                    Close
                  </button>
                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-1.5 text-xs bg-[#FF6A00] text-white font-medium rounded hover:bg-[#FF7A00]"
                  >
                    Print / Save as PDF
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
