    function App() {
      const loadLocal = (key, fallback) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        } catch (e) {
          return fallback;
        }
      };

      const [activeTab, setActiveTab] = useState('dashboard');
      const [agency, setAgency] = useState(() => loadLocal('triosept_agency', DEFAULT_AGENCY));
      const [customSvg, setCustomSvg] = useState(() => localStorage.getItem('triosept_svg') || '');
      const [team, setTeam] = useState(() => loadLocal('triosept_team', INITIAL_TEAM));
      const [clients, setClients] = useState(() => loadLocal('triosept_clients', INITIAL_CLIENTS));
      const [leads, setLeads] = useState(() => loadLocal('triosept_leads', INITIAL_LEADS));
      const [projects, setProjects] = useState(() => loadLocal('triosept_projects', INITIAL_PROJECTS));
      const [tasks, setTasks] = useState(() => loadLocal('triosept_tasks', INITIAL_TASKS));
      const [expenses, setExpenses] = useState(() => loadLocal('triosept_expenses', INITIAL_EXPENSES));
      const [invoices, setInvoices] = useState(() => loadLocal('triosept_invoices', INITIAL_INVOICES));
      
      const [selectedClientForView, setSelectedClientForView] = useState(null);
      const [selectedTeamMemberForView, setSelectedTeamMemberForView] = useState(null);
      const [printInvoiceData, setPrintInvoiceData] = useState(null);
      const [syncTime, setSyncTime] = useState(new Date().toLocaleTimeString());

      // MODALS
      const [activeModal, setActiveModal] = useState(null);
      const [clientForm, setClientForm] = useState({ name: '', contactPerson: '', phone: '', email: '', industry: '', city: 'Ahmedabad', gstin: '' });
      const [leadForm, setLeadForm] = useState({ leadName: '', companyName: '', phone: '', email: '', service: 'FMCG Packaging Design', budget: 50000 });
      const [projectForm, setProjectForm] = useState({ title: '', clientId: '', budget: 50000, deadline: '', designer: 'Tanvi Joshi', priority: 'High' });
      const [taskForm, setTaskForm] = useState({ title: '', assignedTo: 'Tanvi Joshi', dueDate: '', priority: 'Medium' });
      const [teamForm, setTeamForm] = useState({ name: '', role: 'Packaging Designer', phone: '', email: '' });
      const [expenseForm, setExpenseForm] = useState({ title: '', category: 'Software Subscriptions', amount: '', paymentMode: 'UPI' });
      const [progressModalData, setProgressModalData] = useState(null);

      // WHATSAPP MODULE STATE
      const [waRecipient, setWaRecipient] = useState({ phone: '', name: '', type: 'client' });
      const [waTemplate, setWaTemplate] = useState('update');
      const [waCustomMessage, setWaCustomMessage] = useState('');

      // INVOICE BUILDER STATE
      const [invoiceForm, setInvoiceForm] = useState({
        clientId: '',
        clientName: '',
        clientGstin: '',
        clientAddress: '',
        date: new Date().toISOString().split('T')[0],
        dueDate: new Date(Date.now() + 15 * 86400000).toISOString().split('T')[0],
        taxType: 'CGST_SGST',
        discount: 0,
        paidAmount: 0,
        paymentTerms: 'Payment due within 15 days upon receipt',
        items: [{ desc: 'FMCG Packaging Design & 3D Visualizer Sprint', sac: '998391', qty: 1, rate: 35000 }]
      });
      const [invoiceFilterStatus, setInvoiceFilterStatus] = useState('ALL');

      useEffect(() => {
        localStorage.setItem('triosept_agency', JSON.stringify(agency));
        localStorage.setItem('triosept_team', JSON.stringify(team));
        localStorage.setItem('triosept_clients', JSON.stringify(clients));
        localStorage.setItem('triosept_leads', JSON.stringify(leads));
        localStorage.setItem('triosept_projects', JSON.stringify(projects));
        localStorage.setItem('triosept_tasks', JSON.stringify(tasks));
        localStorage.setItem('triosept_expenses', JSON.stringify(expenses));
        localStorage.setItem('triosept_invoices', JSON.stringify(invoices));
        if (customSvg) localStorage.setItem('triosept_svg', customSvg);
        setSyncTime(new Date().toLocaleTimeString());
      }, [agency, team, clients, leads, projects, tasks, expenses, invoices, customSvg]);

      const totalRevenue = useMemo(() => invoices.reduce((acc, inv) => acc + (inv.paidAmount || 0), 0), [invoices]);
      const totalExpenses = useMemo(() => expenses.reduce((acc, exp) => acc + exp.amount, 0), [expenses]);
      const netProfit = totalRevenue - totalExpenses;
      const totalOutstanding = useMemo(() => invoices.reduce((acc, inv) => acc + (inv.amount - (inv.paidAmount || 0)), 0), [invoices]);

      const filteredInvoices = useMemo(() => {
        if (invoiceFilterStatus === 'ALL') return invoices;
        return invoices.filter(i => i.status === invoiceFilterStatus);
      }, [invoices, invoiceFilterStatus]);

      const invoiceCalculations = useMemo(() => {
        const subtotal = invoiceForm.items.reduce((acc, item) => acc + ((parseInt(item.qty) || 1) * (parseFloat(item.rate) || 0)), 0);
        const discountedSubtotal = Math.max(0, subtotal - (parseFloat(invoiceForm.discount) || 0));
        let taxRate = 0;
        if (invoiceForm.taxType === 'CGST_SGST' || invoiceForm.taxType === 'IGST') taxRate = 0.18;
        const taxAmount = Math.round(discountedSubtotal * taxRate);
        const grandTotal = discountedSubtotal + taxAmount;
        const balanceDue = Math.max(0, grandTotal - (parseFloat(invoiceForm.paidAmount) || 0));
        return { subtotal, discountedSubtotal, taxAmount, grandTotal, balanceDue };
      }, [invoiceForm]);

      const handleSvgUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setCustomSvg(event.target.result);
          reader.readAsText(file);
        }
      };

      // LINE ITEM CONTROLS
      const addInvoiceItem = () => {
        setInvoiceForm({ ...invoiceForm, items: [...invoiceForm.items, { desc: '', sac: '998391', qty: 1, rate: 0 }] });
      };
      const removeInvoiceItem = (index) => {
        if (invoiceForm.items.length <= 1) return;
        setInvoiceForm({ ...invoiceForm, items: invoiceForm.items.filter((_, i) => i !== index) });
      };
      const updateInvoiceItem = (index, field, value) => {
        const updated = [...invoiceForm.items];
        updated[index][field] = value;
        setInvoiceForm({ ...invoiceForm, items: updated });
      };

      const handleSelectClientForInvoice = (clientId) => {
        const found = clients.find(c => c.id === clientId);
        if (found) {
          setInvoiceForm({
            ...invoiceForm,
            clientId: found.id,
            clientName: found.name,
            clientGstin: found.gstin || '',
            clientAddress: `${found.city}, Gujarat`
          });
        }
      };

      // SUBMIT HANDLERS
      const handleCreateInvoice = (e) => {
        e.preventDefault();
        if (!invoiceForm.clientName) return;
        const { subtotal, taxAmount, grandTotal } = invoiceCalculations;
        const paid = parseFloat(invoiceForm.paidAmount) || 0;
        let derivedStatus = 'Unpaid';
        if (paid >= grandTotal && grandTotal > 0) derivedStatus = 'Paid';
        else if (paid > 0) derivedStatus = 'Partially Paid';

        const newInvoice = {
          id: `INV-2026-${Math.floor(100 + Math.random() * 900)}`,
          clientId: invoiceForm.clientId || 'CL-101',
          clientName: invoiceForm.clientName,
          clientGstin: invoiceForm.clientGstin || 'Unregistered',
          clientAddress: invoiceForm.clientAddress || 'Ahmedabad, Gujarat',
          date: invoiceForm.date,
          dueDate: invoiceForm.dueDate,
          taxType: invoiceForm.taxType,
          discount: parseFloat(invoiceForm.discount) || 0,
          subtotal: subtotal,
          taxAmount: taxAmount,
          amount: grandTotal,
          paidAmount: paid,
          status: derivedStatus,
          paymentTerms: invoiceForm.paymentTerms,
          items: invoiceForm.items.map(it => ({
            desc: it.desc || 'Brand Identity & Design Service',
            sac: it.sac || '998391',
            qty: parseInt(it.qty) || 1,
            rate: parseFloat(it.rate) || 0,
            amount: (parseInt(it.qty) || 1) * (parseFloat(it.rate) || 0)
          }))
        };

        setInvoices([newInvoice, ...invoices]);
        setActiveModal(null);
      };

      const handleUpdateInvoiceStatus = (invId, newStatus) => {
        setInvoices(invoices.map(inv => {
          if (inv.id !== invId) return inv;
          let newPaid = inv.paidAmount;
          if (newStatus === 'Paid') newPaid = inv.amount;
          if (newStatus === 'Unpaid') newPaid = 0;
          return { ...inv, status: newStatus, paidAmount: newPaid };
        }));
      };

      const handleCreateClient = (e) => {
        e.preventDefault();
        if (!clientForm.name) return;
        setClients([...clients, {
          id: `CL-${Math.floor(100 + Math.random() * 900)}`,
          name: clientForm.name,
          contactPerson: clientForm.contactPerson || 'Authorized Rep',
          phone: clientForm.phone || '+91 90000 00000',
          email: clientForm.email || 'info@client.com',
          industry: clientForm.industry || 'General',
          city: clientForm.city || 'Ahmedabad',
          gstin: clientForm.gstin || '24AAAAA0000A1Z5',
          totalBilled: 0,
          outstanding: 0
        }]);
        setActiveModal(null);
        setClientForm({ name: '', contactPerson: '', phone: '', email: '', industry: '', city: 'Ahmedabad', gstin: '' });
      };

      const handleCreateTeamMember = (e) => {
        e.preventDefault();
        if (!teamForm.name) return;
        setTeam([...team, {
          id: `TM-${team.length + 1}`,
          name: teamForm.name,
          role: teamForm.role,
          phone: teamForm.phone || '+91 90000 00000',
          email: teamForm.email || 'team@triosept.com',
          active: true
        }]);
        setActiveModal(null);
        setTeamForm({ name: '', role: 'Packaging Designer', phone: '', email: '' });
      };

      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!projectForm.title) return;
        const selectedCl = clients.find(c => c.id === projectForm.clientId) || clients[0];
        setProjects([...projects, {
          id: `PRJ-${Math.floor(100 + Math.random() * 900)}`,
          title: projectForm.title,
          clientId: selectedCl ? selectedCl.id : 'CL-101',
          clientName: selectedCl ? selectedCl.name : 'Vedic Pure Foods Pvt Ltd',
          budget: parseInt(projectForm.budget) || 50000,
          deadline: projectForm.deadline || new Date().toISOString().split('T')[0],
          designer: projectForm.designer,
          priority: projectForm.priority,
          status: 'In Progress',
          progress: 10

        setActiveModal(null);
        setProjectForm({ title: '', clientId: '', budget: 50000, deadline: '', designer: team[0] ? team[0].name : 'Tanvi Joshi', priority: 'High' });
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!taskForm.title || !selectedClientForView) return;
        setTasks([...tasks, {
          id: `TSK-${Math.floor(1000 + Math.random() * 9000)}`,
          clientId: selectedClientForView.id,
          title: taskForm.title,
          assignedTo: taskForm.assignedTo,
          dueDate: taskForm.dueDate || new Date().toISOString().split('T')[0],
          priority: taskForm.priority,
          completed: false
        }]);
        setActiveModal(null);
        setTaskForm({ title: '', assignedTo: team[0] ? team[0].name : 'Tanvi Joshi', dueDate: '', priority: 'Medium' });
      };

      const handleCreateExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.title || !expenseForm.amount) return;
        setExpenses([...expenses, {
          id: `EXP-${Math.floor(100 + Math.random() * 900)}`,
          title: expenseForm.title,
          category: expenseForm.category,
          amount: parseInt(expenseForm.amount) || 0,
          date: new Date().toISOString().split('T')[0],
          paymentMode: expenseForm.paymentMode

        setActiveModal(null);
        setExpenseForm({ title: '', category: 'Software Subscriptions', amount: '', paymentMode: 'UPI' });

        if (waCustomMessage) return waCustomMessage;
        if (waTemplate === 'update') {
          return `Hello ${waRecipient.name || 'Sir/Ma\'am'},\n\nWe have updated your design progress at TRIOSEPT DESIGN STUDIO. Please check and let us know your feedback!\n\nBest Regards,\nTRIOSEPT DESIGN STUDIO`;

          return `Dear ${waRecipient.name || 'Client'},\n\nThis is a polite reminder regarding your pending invoice for creative branding services. Kindly clear the outstanding balance via UPI (${agency.upiId}) or Bank Transfer.\n\nThank you,\nTRIOSEPT DESIGN STUDIO`;
        } else if (waTemplate === 'quote') {
          return `Hello ${waRecipient.name || 'Client'},\n\nThank you for reaching out to TRIOSEPT DESIGN STUDIO. We have prepared your customized design proposal. Looking forward to partnering with your brand!\n\nRegards,\nTRIOSEPT DESIGN STUDIO`;
        }
        return `Hello from TRIOSEPT DESIGN STUDIO!`;
      };

      const openWhatsApp = () => {
        const cleanPhone = (waRecipient.phone || '').replace(/[^0-9]/g, '');
        const targetPhone = cleanPhone.length === 10 ? `91${cleanPhone}` : cleanPhone;

        <div className="flex min-h-screen">

              <div className="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">

                ) : (
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#FF5500] to-[#FF8800] flex items-center justify-center text-white font-black text-sm">
                    T
                  </div>
                )}
                <div>
                  <h1 className="text-sm font-bold tracking-wider text-white">TRIOSEPT</h1>
                  <p className="text-[10px] text-[#FF6A00] font-semibold tracking-widest uppercase">BRANDING AGENCY</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard' },
                  { id: 'clients', label: 'Client 360 & Tasks' },
                  { id: 'team', label: 'Creative Team & Assign' },
                  { id: 'projects', label: 'Projects' },
                  { id: 'leads', label: 'Leads Pipeline' },
                  { id: 'finance', label: 'Invoices & Billing' },
                  { id: 'whatsapp', label: 'WhatsApp Dispatcher' },

                    key={item.id}
                    onClick={() => { 
                      setActiveTab(item.id); 
                      setSelectedClientForView(null);
                      setSelectedTeamMemberForView(null);

                    className={`w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium transition-all ${

                        ? 'bg-[#FF6A00] text-white shadow-lg shadow-[#FF6A00]/20'

                        value={invoiceForm.clientId}
                        onChange={(e) => handleSelectClientForInvoice(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200"
                      >
                        <option value="">-- Custom Client --</option>
                        {clients.map(c => (
                          <option key={c.id} value={c.id}>{c.name} ({c.city})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Client Business Name *</label>
                      <input 
                        type="text" required 
                        value={invoiceForm.clientName} 
                        onChange={e => setInvoiceForm({ ...invoiceForm, clientName: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200" 
                      />
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <label className="block font-semibold text-slate-300">Invoice Items</label>
                      <button type="button" onClick={addInvoiceItem} className="text-[11px] text-[#FF7A00] hover:underline">+ Add Line</button>
                    </div>

                    {invoiceForm.items.map((item, idx) => (
                      <div key={idx} className="flex items-center gap-2 bg-slate-900/80 p-2 rounded-lg border border-slate-800">
                        <input 
                          type="text" required placeholder="Service Description"
                          value={item.desc} onChange={e => updateInvoiceItem(idx, 'desc', e.target.value)}
                          className="flex-1 bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200"
                        />
                        <input 
                          type="number" placeholder="Qty" min="1"
                          value={item.qty} onChange={e => updateInvoiceItem(idx, 'qty', e.target.value)}
                          className="w-14 bg-slate-800 border border-slate-700 rounded p-1.5 text-center text-slate-200"
                        />
                        <input 
                          type="number" placeholder="Rate (₹)"
                          value={item.rate} onChange={e => updateInvoiceItem(idx, 'rate', e.target.value)}
                          className="w-24 bg-slate-800 border border-slate-700 rounded p-1.5 text-right text-slate-200"
                        />
                        {invoiceForm.items.length > 1 && (
                          <button type="button" onClick={() => removeInvoiceItem(idx)} className="text-rose-400 px-1">✕</button>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Discount (₹)</label>
                      <input 
                        type="number" value={invoiceForm.discount} 
                        onChange={e => setInvoiceForm({ ...invoiceForm, discount: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Advance Received (₹)</label>
                      <input 
                        type="number" value={invoiceForm.paidAmount} 
                        onChange={e => setInvoiceForm({ ...invoiceForm, paidAmount: e.target.value })} 
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-emerald-400 font-bold" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg hover:bg-[#FF7A00]">Save & Generate</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD CLIENT MODAL */}
          {activeModal === 'newClient' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Add New Client</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateClient} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Company Name *</label>
                    <input type="text" required value={clientForm.name} onChange={e => setClientForm({ ...clientForm, name: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Contact Person</label>
                      <input type="text" value={clientForm.contactPerson} onChange={e => setClientForm({ ...clientForm, contactPerson: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Phone</label>
                      <input type="text" value={clientForm.phone} onChange={e => setClientForm({ ...clientForm, phone: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg">Save Client</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD TASK MODAL (CLIENT 360) WITH TEAM SELECTOR */}
          {activeModal === 'newTask' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Add Task for {selectedClientForView ? selectedClientForView.name : ''}</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateTask} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Task Title *</label>
                    <input type="text" required value={taskForm.title} onChange={e => setTaskForm({ ...taskForm, title: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Assign Team Member</label>
                      <select 
                        value={taskForm.assignedTo}
                        onChange={e => setTaskForm({ ...taskForm, assignedTo: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-sky-400 font-semibold"
                      >
                        {team.map(m => (
                          <option key={m.id} value={m.name}>{m.name}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Due Date</label>
                      <input type="date" value={taskForm.dueDate} onChange={e => setTaskForm({ ...taskForm, dueDate: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF6A00] text-white font-medium rounded-lg">Add Task</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RECORD EXPENSE MODAL */}
          {activeModal === 'newExpense' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">Record Studio Expense</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateExpense} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Description *</label>
                    <input type="text" required value={expenseForm.title} onChange={e => setExpenseForm({ ...expenseForm, title: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Category</label>
                      <select value={expenseForm.category} onChange={e => setExpenseForm({ ...expenseForm, category: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200">
                        <option value="Software Subscriptions">Software Subscriptions</option>
                        <option value="Hardware Expenses">Hardware Expenses</option>
                        <option value="Printing Expenses">Printing Expenses</option>
                        <option value="Freelancer Payments">Freelancer Payments</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Amount (₹) *</label>
                      <input type="number" required value={expenseForm.amount} onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value })} className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-rose-500 text-white font-medium rounded-lg">Save Expense</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* UPDATE PROJECT PROGRESS MODAL */}
          {progressModalData && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#0F131D] border border-slate-800 w-full max-w-xs rounded-2xl p-5 shadow-2xl">
                <h3 className="text-sm font-bold text-white mb-2">Update Progress</h3>
                <p className="text-xs text-slate-400 mb-4">{progressModalData.title}</p>
                <div className="space-y-4">
                  <div>
                    <div className="flex justify-between text-xs text-slate-300 mb-1">
                      <span>Percentage</span>
                      <span className="font-bold text-[#FF6A00]">{progressModalData.progress}%</span>
                    </div>
                    <input 
                      type="range" min="0" max="100" 
                      value={progressModalData.progress} 
                      onChange={e => setProgressModalData({ ...progressModalData, progress: e.target.value })}
                      className="w-full accent-[#FF6A00]" 
                    />
                  </div>
                  <div className="flex justify-end gap-2">
                    <button onClick={() => setProgressModalData(null)} className="px-3 py-1.5 bg-slate-800 text-xs text-slate-300 rounded-lg">Cancel</button>
                    <button 
                      onClick={() => {
                        setProjects(projects.map(p => p.id === progressModalData.id ? { ...p, progress: parseInt(progressModalData.progress) || 0 } : p));
                        setProgressModalData(null);
                      }} 
                      className="px-4 py-1.5 bg-[#FF6A00] text-xs text-white font-medium rounded-lg"
                    >
                      Update
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ==================== TAX INVOICE PRINT / PDF MODAL ==================== */}
          {printInvoiceData && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white text-slate-900 w-full max-w-3xl rounded-xl p-8 max-h-[92vh] overflow-y-auto" id="print-area">
                {/* Header */}
                <div className="flex justify-between items-start border-b pb-5 mb-5">
                  <div className="space-y-1">
                    <h2 className="text-2xl font-black tracking-tight text-slate-900">{agency.name}</h2>
                    <p className="text-xs font-semibold text-[#FF6A00] tracking-wider uppercase">Branding Agency</p>
                    <p className="text-xs text-slate-600 max-w-sm mt-1">{agency.address}</p>
                    <p className="text-xs text-slate-600">Phone: {agency.phone} | Email: {agency.email}</p>
                    <p className="text-xs font-bold text-slate-800">GSTIN: {agency.gstin}</p>
                  </div>
                  <div className="text-right">
                    <span className="inline-block px-3 py-1 bg-slate-100 text-[#FF6A00] font-black text-sm tracking-wider rounded border border-slate-200">
                      TAX INVOICE
                    </span>
                    <h3 className="text-base font-bold text-slate-900 mt-2">{printInvoiceData.id}</h3>
                    <p className="text-xs text-slate-500">Invoice Date: <span className="font-semibold text-slate-700">{printInvoiceData.date}</span></p>
                    <p className="text-xs text-slate-500">Due Date: <span className="font-semibold text-slate-700">{printInvoiceData.dueDate}</span></p>
                    <p className="text-xs text-slate-500">Payment Status: <span className="font-bold text-emerald-600 uppercase">{printInvoiceData.status}</span></p>
                  </div>
                </div>

                {/* Billed To / Client Box */}
                <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 mb-5 flex justify-between items-start text-xs">
                  <div>
                    <p className="font-bold text-slate-500 uppercase tracking-wider text-[10px]">Billed To (Client):</p>
                    <h4 className="text-sm font-bold text-slate-900 mt-0.5">{printInvoiceData.clientName}</h4>
                    <p className="text-slate-600">{printInvoiceData.clientAddress || 'Gujarat, India'}</p>
                    <p className="text-slate-700 font-semibold mt-1">Client GSTIN: {printInvoiceData.clientGstin || 'Unregistered / Consumer'}</p>
                  </div>
                  <div className="text-right">
                    <p className="font-bold text-slate-500 uppercase tracking-wider text-[10px]">Place of Supply:</p>
                    <p className="font-semibold text-slate-800">24 - Gujarat</p>
                  </div>
                </div>

                {/* Items Table */}
                <table className="w-full text-left text-xs mb-6 border border-slate-200 rounded">
                  <thead className="bg-slate-100 border-b border-slate-200 text-slate-700 font-bold">
                    <tr>
                      <th className="p-2.5">#</th>
                      <th className="p-2.5">Service Description</th>
                      <th className="p-2.5 text-center">SAC Code</th>
                      <th className="p-2.5 text-center">Qty</th>
                      <th className="p-2.5 text-right">Rate (₹)</th>
                      <th className="p-2.5 text-right">Taxable Amount (₹)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200">
                    {printInvoiceData.items.map((item, idx) => (
                      <tr key={idx}>
                        <td className="p-2.5 text-slate-500">{idx + 1}</td>
                        <td className="p-2.5 font-medium text-slate-800">{item.desc}</td>
                        <td className="p-2.5 text-center text-slate-600 font-mono">{item.sac || '998391'}</td>
                        <td className="p-2.5 text-center text-slate-700">{item.qty}</td>
                        <td className="p-2.5 text-right text-slate-700">₹{item.rate.toLocaleString('en-IN')}</td>
                        <td className="p-2.5 text-right font-semibold text-slate-900">₹{item.amount.toLocaleString('en-IN')}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {/* Bank Details & Financial Summary */}
                <div className="grid grid-cols-2 gap-4 text-xs border-t pt-4">
                  <div className="space-y-1">
                    <p className="font-bold text-slate-800 uppercase tracking-wider text-[10px]">Bank Transfer / RTGS / NEFT Details:</p>
                    <div className="p-2.5 bg-slate-50 rounded border border-slate-200 space-y-0.5 text-slate-700">
                      <p><span className="text-slate-500">Account Name:</span> <span className="font-semibold">{agency.accountName}</span></p>
                      <p><span className="text-slate-500">Bank Name:</span> <span className="font-semibold">{agency.bankName}</span></p>
                      <p><span className="text-slate-500">Branch:</span> {agency.bankBranch}</p>
                      <p><span className="text-slate-500">Account No:</span> <span className="font-bold font-mono">{agency.accountNumber}</span></p>
                      <p><span className="text-slate-500">IFSC Code:</span> <span className="font-bold font-mono">{agency.ifsc}</span></p>
                      <p><span className="text-slate-500">UPI ID:</span> <span className="font-semibold text-[#FF6A00]">{agency.upiId}</span></p>
                    </div>
                  </div>

                  <div className="space-y-1.5 text-right">
                    <div className="flex justify-between text-slate-600">
                      <span>Total Taxable Subtotal:</span>
                      <span className="font-semibold">₹{(printInvoiceData.subtotal || 0).toLocaleString('en-IN')}</span>
                    </div>

                    {printInvoiceData.discount > 0 && (
                      <div className="flex justify-between text-rose-600">
                        <span>Discount:</span>
                        <span>- ₹{printInvoiceData.discount.toLocaleString('en-IN')}</span>
                      </div>
                    )}

                    <div className="flex justify-between text-slate-600">
                      <span>GST (18%):</span>
                      <span className="font-semibold">₹{(printInvoiceData.taxAmount || 0).toLocaleString('en-IN')}</span>
                    </div>

                    <div className="flex justify-between text-sm font-black text-slate-900 border-t border-slate-300 pt-2">
                      <span>Invoice Total:</span>
                      <span className="text-[#FF6A00]">₹{printInvoiceData.amount.toLocaleString('en-IN')}</span>
                    </div>

                    <div className="flex justify-between text-slate-600">
                      <span>Paid / Advance Received:</span>
                      <span className="font-semibold text-emerald-600">₹{(printInvoiceData.paidAmount || 0).toLocaleString('en-IN')}</span>
                    </div>

                    <div className="flex justify-between font-bold text-slate-900 border-t border-dashed border-slate-300 pt-1.5">
                      <span>Balance Outstanding Due:</span>
                      <span className="text-amber-600">
                        ₹{Math.max(0, printInvoiceData.amount - (printInvoiceData.paidAmount || 0)).toLocaleString('en-IN')}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Signature Block (Vikas Modi name removed, clean official line kept) */}
                <div className="flex justify-between items-end mt-12 pt-4 border-t border-slate-200">
                  <div className="text-[10px] text-slate-400">
                    <p>Computer generated invoice, valid digitally.</p>
                    <p>Thank you for partnering with TRIOSEPT DESIGN STUDIO.</p>
                  </div>
                  <div className="text-center">
                    <div className="w-40 border-b border-slate-400 h-10 mb-2"></div>
                    <p className="text-[10px] font-bold uppercase text-slate-700">Authorized Signatory</p>
                    <p className="text-[9px] text-slate-500">TRIOSEPT DESIGN STUDIO</p>
                  </div>
                </div>

                {/* Print Controls */}
                <div className="flex justify-end gap-3 mt-6 print:hidden">
                  <button 
                    onClick={() => setPrintInvoiceData(null)}
                    className="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200"
                  >
                    Close
                  </button>
                  <button 
                    onClick={() => window.print()}
                    className="px-5 py-2 text-xs bg-[#FF6A00] text-white font-bold rounded-lg hover:bg-[#FF7A00]"
                  >
                    Print / Download PDF
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
